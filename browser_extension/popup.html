<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BossPilot 一键采集</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      #status {
        margin: 10px 0;
        min-height: 36px;
        color: #4b5563;
        font-size: 13px;
        line-height: 1.5;
      }
      .panel {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #e5e7eb;
      }
      .metric {
        margin: 4px 0;
        color: #374151;
        font-size: 13px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        margin-top: 8px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
      button.secondary {
        background: #4b5563;
      }
      button.danger {
        background: #dc2626;
      }
      button:disabled {
        cursor: not-allowed;
        background: #9ca3af;
      }
    </style>
  </head>
  <body>
    <h1>BossPilot 一键采集</h1>
    <div id="status">当前页面状态：等待采集</div>
    <button id="sendButton">发送到 BossPilot 分析</button>

    <div class="panel">
      <h1>求职会话监控</h1>
      <div class="metric">当前状态：<span id="monitorStatus">未开始</span></div>
      <div class="metric">已采集页面数：<span id="pageCount">0</span></div>
      <div class="metric">已采集岗位数：<span id="jobCount">0</span></div>
      <button id="startMonitorButton">开始监控</button>
      <button id="endUploadButton" class="secondary">结束并上传</button>
      <button id="refreshCountButton" class="secondary">查看已采集数量</button>
      <button id="clearSessionButton" class="danger">清空本次记录</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
